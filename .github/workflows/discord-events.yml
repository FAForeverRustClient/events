name: Mirror Discord scheduled events

# Reads the guild scheduled events of every server listed in sources.json and
# writes them into calendar.json. See DISCORD-SETUP.md for what it takes to
# enable a server.
#
# A missing token is handled differently depending on who asked. On the cron it
# is a warning and a green run: the schedule exists before anybody has
# necessarily configured a server, and a red cross every six hours teaches
# everybody to ignore the job. On a run somebody started by hand it is an
# error, because they pressed the button expecting something to happen, and a
# green tick over "skipping" is how that went unnoticed for an afternoon.

on:
  schedule:
    # Four times a day, off the hour. An event added on Discord this morning is
    # on the calendar by the afternoon, and the cron does not join the crowd of
    # jobs everybody schedules on the hour.
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

# The only write this job makes is the commit below.
permissions:
  contents: write

concurrency:
  group: calendar-write
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bot lives with the calendar format it writes, and with its tests.
      # `develop` rather than `main`: the format and the bot change together
      # there, and this job writes data rather than shipping code.
      - name: Check out the client, for the bot
        uses: actions/checkout@v4
        with:
          repository: FAForeverRustClient/FAForeverRustClient
          ref: develop
          path: .client
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read the scheduled events
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ]; then
            message="DISCORD_BOT_TOKEN is not set on this repository (FAForeverRustClient/events). Add it under Settings, Secrets and variables, Actions, New repository secret, with exactly that name. A secret on another repository, or under another name, is not visible to this workflow. See DISCORD-SETUP.md, part C."
            {
              echo "### The mirror did nothing"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$BY_HAND" = "true" ]; then
              echo "::error::$message"
              exit 1
            fi
            echo "::warning::$message"
            exit 0
          fi

          if ! node .client/scripts/events-bot.mjs \
            --sources sources.json --calendar calendar.json > .mirror.log 2>&1; then
            cat .mirror.log
            {
              echo "### The mirror failed"
              echo
              echo '```'
              cat .mirror.log
              echo '```'
              echo
              echo "The troubleshooting list at the bottom of DISCORD-SETUP.md covers every answer Discord gives here."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cat .mirror.log
          # On the run page rather than only in the log: "0 events" is a real
          # answer and worth being able to see without opening a job.
          {
            echo "### What the mirror found"
            echo
            echo '```'
            cat .mirror.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f .mirror.log

      - name: Commit what changed
        run: |
          if git diff --quiet -- calendar.json; then
            echo "The calendar is already up to date."
            echo "The calendar was already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "faf-events-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(calendar): refresh the Discord scheduled events" -- calendar.json
          git push
